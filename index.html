<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>エルダーフサルク ルーン石 日次ドロー</title><script src="https://cdn.tailwindcss.com"></script><style>  @keyframes flipIn {    0% { transform: rotateY(90deg) scale(0.8); opacity: 0; }    100% { transform: rotateY(0deg) scale(1); opacity: 1; }  }  @keyframes shimmer {    0% { background-position: -200% center; }    100% { background-position: 200% center; }  }  .rune-appear { animation: flipIn 0.6s ease-out forwards; }  .rune-symbol {    font-size: clamp(4rem, 15vw, 8rem);    text-shadow: 0 0 20px rgba(167,139,250,0.8), 0 0 40px rgba(139,92,246,0.4);    display: inline-block;  }  .reversed { transform: rotate(180deg); display: inline-block; }  .stone-bg {    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);  }  .rune-card {    background: linear-gradient(135deg, rgba(49,46,129,0.9), rgba(30,27,75,0.95));    border: 1px solid rgba(167,139,250,0.3);    backdrop-filter: blur(4px);  }  .glow-btn {    box-shadow: 0 0 15px rgba(167,139,250,0.4);    transition: all 0.3s ease;  }  .glow-btn:hover {    box-shadow: 0 0 25px rgba(167,139,250,0.7);    transform: translateY(-1px);  }  .history-item:hover { background: rgba(167,139,250,0.1); }  :focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }</style></head><body class="stone-bg min-h-screen text-purple-100 font-sans"><header class="border-b border-purple-800/50 px-4 py-4">  <div class="max-w-4xl mx-auto flex items-center gap-3">    <span class="text-3xl" aria-hidden="true">ᚱ</span>    <div>      <h1 class="text-xl font-bold text-purple-200">エルダーフサルク ルーン石 日次ドロー</h1>      <p class="text-purple-400 text-sm">Elder Futhark Daily Rune Oracle</p>    </div>  </div></header><main class="max-w-4xl mx-auto px-4 py-6">  <!-- Tabs -->  <div role="tablist" aria-label="メインメニュー" class="flex gap-2 mb-6 border-b border-purple-800/50">    <button role="tab" aria-selected="true" aria-controls="panel-draw" id="tab-draw"      class="tab-btn px-4 py-2 text-sm font-medium text-purple-200 border-b-2 border-purple-400 -mb-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-purple-400"      onclick="switchTab('draw')">ドロー占い</button>    <button role="tab" aria-selected="false" aria-controls="panel-history" id="tab-history"      class="tab-btn px-4 py-2 text-sm font-medium text-purple-500 border-b-2 border-transparent -mb-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-purple-400"      onclick="switchTab('history')">過去の記録</button>    <button role="tab" aria-selected="false" aria-controls="panel-runes" id="tab-runes"      class="tab-btn px-4 py-2 text-sm font-medium text-purple-500 border-b-2 border-transparent -mb-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-purple-400"      onclick="switchTab('runes')">ルーン一覧</button>  </div>  <!-- Draw Panel -->  <div id="panel-draw" role="tabpanel" aria-labelledby="tab-draw">    <!-- Spread selection -->    <fieldset class="mb-6">      <legend class="text-purple-300 text-sm mb-3 font-medium">スプレッドを選択</legend>      <div class="flex flex-wrap gap-3">        <label class="cursor-pointer">          <input type="radio" name="spread" value="1" class="sr-only" id="spread1" checked>          <span class="spread-label px-4 py-2 rounded-lg border border-purple-600 text-sm bg-purple-700/50 text-purple-200 hover:bg-purple-700 transition-colors" data-for="spread1">            シングルドロー (1枚)          </span>        </label>        <label class="cursor-pointer">          <input type="radio" name="spread" value="3" class="sr-only" id="spread3">          <span class="spread-label px-4 py-2 rounded-lg border border-purple-800/50 text-sm text-purple-500 hover:bg-purple-800/30 transition-colors" data-for="spread3">            過去・現在・未来 (3枚)          </span>        </label>        <label class="cursor-pointer">          <input type="radio" name="spread" value="5" class="sr-only" id="spread5">          <span class="spread-label px-4 py-2 rounded-lg border border-purple-800/50 text-sm text-purple-500 hover:bg-purple-800/30 transition-colors" data-for="spread5">            フルスプレッド (5枚)          </span>        </label>      </div>    </fieldset>    <!-- Today's status notice -->    <div id="today-notice" class="hidden mb-4 px-4 py-3 rounded-lg bg-amber-900/40 border border-amber-700/50 text-amber-300 text-sm">      <span aria-live="polite">本日のドローは既に完了しています。以下に今日のリーディングを表示します。</span>    </div>    <!-- Draw button -->    <div class="text-center mb-8">      <button id="draw-btn" onclick="performDraw()"        class="glow-btn px-8 py-4 bg-purple-700 hover:bg-purple-600 text-white font-bold text-lg rounded-xl border border-purple-500 transition-all"        aria-label="ルーンをドローする">        ᚠ ルーンをドロー ᚠ      </button>    </div>    <!-- Results area -->    <div id="results-area" role="region" aria-label="ドロー結果" aria-live="polite"></div>  </div>  <!-- History Panel -->  <div id="panel-history" role="tabpanel" aria-labelledby="tab-history" class="hidden">    <h2 class="text-purple-300 font-medium mb-4">過去のドロー記録</h2>    <div id="history-list" class="space-y-3"></div>  </div>  <!-- Runes Reference Panel -->  <div id="panel-runes" role="tabpanel" aria-labelledby="tab-runes" class="hidden">    <h2 class="text-purple-300 font-medium mb-4">エルダーフサルク 24のルーン</h2>    <div id="runes-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>  </div></main><!-- Rune detail modal --><div id="rune-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"  class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4"  onclick="closeModal(event)">  <div class="rune-card rounded-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">    <button onclick="closeModal()" aria-label="閉じる"      class="float-right text-purple-400 hover:text-purple-200 text-2xl leading-none mb-2">&times;</button>    <div id="modal-content"></div>  </div></div><script>function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }const RUNES = [  { symbol: 'ᚠ', name: 'Fehu', phonetic: 'F', aett: 1,    meaning: '牛・富・財産', upright: '豊かさ、繁栄、物質的成功。富と資源の流入。新しい財の獲得。',    reversed: '財の損失、強欲への警告。物質に依存しすぎている。富の再評価が必要。',    modern: '金融、キャリア、物質的な目標における前進。努力が実を結ぶ時。' },  { symbol: 'ᚢ', name: 'Uruz', phonetic: 'U', aett: 1,    meaning: '野牛・力・健康', upright: '原始的な力、スタミナ、健康。変化への適応力と回復力。',    reversed: '力の喪失、健康上の懸念。機会を逃している可能性。内なる力を見失っている。',    modern: '身体的健康、意志力、困難を乗り越える強さ。自分の潜在能力を信じること。' },  { symbol: 'ᚦ', name: 'Thurisaz', phonetic: 'TH', aett: 1,    meaning: '巨人・棘・守護', upright: '保護、反動的な力。障害が実は守りになっている。慎重な行動を。',    reversed: '危険な衝動性、無防備。悪い力に対して扉が開いている。',    modern: '境界を設けること、自分を守ること。試練は強さをもたらす。' },  { symbol: 'ᚨ', name: 'Ansuz', phonetic: 'A', aett: 1,    meaning: 'オーディン・言葉・神の声', upright: 'コミュニケーション、知恵、神のメッセージ。重要な啓示が訪れる。',    reversed: 'コミュニケーションの障害、偽り、悪い助言。情報の流れに注意を。',    modern: '表現、スピーチ、学習、精神的なガイダンス。内なる声に耳を傾けて。' },  { symbol: 'ᚱ', name: 'Raidho', phonetic: 'R', aett: 1,    meaning: '旅・乗り物・正義', upright: '旅、動き、変化。物事が正しい方向に進んでいる。自然なリズム。',    reversed: '旅の中断、不正義、不調和。計画の見直しが必要かもしれない。',    modern: '人生の旅路、方向性、個人の成長の旅。道を進み続けること。' },  { symbol: 'ᚲ', name: 'Kenaz', phonetic: 'K', aett: 1,    meaning: '炬火・知識・創造', upright: '光明、創造性、知識。火のように燃える情熱と啓発。',    reversed: '暗闇、病、知識の喪失。創造性がブロックされている。',    modern: '技術、創造的な表現、学習と啓発。自分の内なる光を輝かせて。' },  { symbol: 'ᚷ', name: 'Gebo', phonetic: 'G', aett: 1,    meaning: '贈り物・パートナーシップ', upright: '贈り物、パートナーシップ、均衡。与えることと受け取ること。',    reversed: null,    modern: 'パートナーシップ、バランス、寛大さ。(逆位置なし・常に正位置)' },  { symbol: 'ᚹ', name: 'Wunjo', phonetic: 'W/V', aett: 1,    meaning: '喜び・調和・幸福', upright: '喜び、調和、幸福感。望みが達成される。仲間との絆。',    reversed: '悲嘆、調和の欠如。喜びが遠のいている。内なる葛藤。',    modern: '幸福、充実感、コミュニティ。生の喜びを見つけること。' },  { symbol: 'ᚺ', name: 'Hagalaz', phonetic: 'H', aett: 2,    meaning: '雹・破壊・変容', upright: '突然の中断、破壊的な力。コントロール不能な変化。試練の時。',    reversed: null,    modern: '予期しない変化、内なる嵐。破壊は再生への道。(逆位置なし)' },  { symbol: 'ᚾ', name: 'Naudhiz', phonetic: 'N', aett: 2,    meaning: '必要・制約・忍耐', upright: '必要性、制約、忍耐の要求。困難を通じた成長。',    reversed: '制約から学ばない。忍耐の欠如。外部の助けを求める時。',    modern: '緊急の必要性、自制、困難から生まれる強さ。' },  { symbol: 'ᛁ', name: 'Isa', phonetic: 'I', aett: 2,    meaning: '氷・停滞・静止', upright: '停滞、冷却、静止の必要性。物事が凍りついている。熟考の時。',    reversed: null,    modern: '一時停止、反省、集中。静けさの中に力がある。(逆位置なし)' },  { symbol: 'ᛃ', name: 'Jera', phonetic: 'J/Y', aett: 2,    meaning: '収穫・一年・周期', upright: '収穫、努力の報い、自然のサイクル。正しい時期に正しいことを。',    reversed: null,    modern: '季節の変化、長期的な報酬、粘り強さへの報酬。(逆位置なし)' },  { symbol: 'ᛇ', name: 'Eihwaz', phonetic: 'EI', aett: 2,    meaning: 'イチイの木・死と再生・変容', upright: '強靭さ、変容、死と再生のサイクル。障害の克服。',    reversed: null,    modern: '人生の転換点、深い変容、精神的な強さ。(逆位置なし)' },  { symbol: 'ᛈ', name: 'Perthro', phonetic: 'P', aett: 2,    meaning: 'サイコロ筒・運命・神秘', upright: '運命、秘密の知識、隠れた可能性。偶然の中の必然。',    reversed: '隠された真実への恐れ。運命への抵抗。秘密が明かされる危険。',    modern: '神秘、偶然、運命の輪。予期せぬ展開に開かれること。' },  { symbol: 'ᛉ', name: 'Algiz', phonetic: 'Z', aett: 2,    meaning: 'エルク・保護・神聖な守護', upright: '強力な保護、神聖なつながり。自分と他者を守る力。',    reversed: '脆弱性、保護の欠如。誰かに利用されているかもしれない。',    modern: '保護、精神的な覚醒、神聖な守護との接続。' },  { symbol: 'ᛋ', name: 'Sowilo', phonetic: 'S', aett: 2,    meaning: '太陽・勝利・全体性', upright: '太陽のエネルギー、勝利、成功。全体性と自己実現。',    reversed: null,    modern: '太陽のエネルギー、明確な目標、自己の光。(逆位置なし)' },  { symbol: 'ᛏ', name: 'Tiwaz', phonetic: 'T', aett: 3,    meaning: '戦争神テュール・正義・勇気', upright: '勝利、正義、自己犠牲。規律と勇気を持った行動。',    reversed: '不正義、臆病さ、敗北。正しい方向性を見失っている。',    modern: '正義、ロジック、自己規律、より大きな善のための犠牲。' },  { symbol: 'ᛒ', name: 'Berkano', phonetic: 'B', aett: 3,    meaning: '白樺の木・誕生・成長', upright: '新たな始まり、成長、豊饒性。育てることと守ること。',    reversed: '成長の障害、家族の問題、不安定な基盤。',    modern: '新しいプロジェクト、家族、育成、個人的成長の新章。' },  { symbol: 'ᛖ', name: 'Ehwaz', phonetic: 'E', aett: 3,    meaning: '馬・パートナーシップ・移動', upright: '信頼、パートナーシップ、協力。チームワークによる前進。',    reversed: 'パートナーシップの崩壊、信頼の欠如。変化への抵抗。',    modern: '協力関係、旅、変化の受容。信頼できるパートナーとの前進。' },  { symbol: 'ᛗ', name: 'Mannaz', phonetic: 'M', aett: 3,    meaning: '人間・自己・コミュニティ', upright: '自己の知識、人類との繋がり。理性と知性の活用。',    reversed: '自己孤立、コミュニティとの断絶。自己中心的な傾向。',    modern: '人間性、コミュニティ、自己認識、協力の精神。' },  { symbol: 'ᛚ', name: 'Laguz', phonetic: 'L', aett: 3,    meaning: '水・流れ・直感', upright: '流動性、直感、無意識。感情と夢の世界との接続。',    reversed: '感情の混乱、過剰な感受性。流れに逆らっている。',    modern: '直感、夢、感情、精神性。内なる流れに従うこと。' },  { symbol: 'ᛜ', name: 'Ingwaz', phonetic: 'NG', aett: 3,    meaning: '豊饒神イング・潜在力', upright: '完成、潜在力の開花。内なるエネルギーの蓄積と放出。',    reversed: null,    modern: '内部統合、目標の達成、エネルギーの放出。(逆位置なし)' },  { symbol: 'ᛞ', name: 'Dagaz', phonetic: 'D', aett: 3,    meaning: '夜明け・突破口・変容', upright: '突破口、目覚め、変容。暗闇から光へ。大きな変化の瞬間。',    reversed: null,    modern: '悟り、転換点、無限の可能性。希望の夜明け。(逆位置なし)' },  { symbol: 'ᛟ', name: 'Othala', phonetic: 'O', aett: 3,    meaning: '先祖の土地・遺産・ホーム', upright: '遺産、先祖からの知恵、家族のつながり。ルーツへの回帰。',    reversed: '先祖のパターンからの解放が必要。遺産の問題。孤立感。',    modern: '家族、ルーツ、文化的遺産。自分の起源から学ぶこと。' }];const SPREAD_POSITIONS = {  1: ['メッセージ'],  3: ['過去', '現在', '未来'],  5: ['状況', '障害', 'アドバイス', '隠れた影響', '結果']};let currentDraw = null;function getTodayKey() {  const d = new Date();  return `rune_draw_${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`;}function loadHistory() {  try { return JSON.parse(localStorage.getItem('rune_history') || '[]'); }  catch { return []; }}function saveToHistory(draw) {  const history = loadHistory();  const todayKey = getTodayKey();  const idx = history.findIndex(h => h.dateKey === todayKey);  if (idx >= 0) history[idx] = draw; else history.unshift(draw);  if (history.length > 90) history.splice(90);  localStorage.setItem('rune_history', JSON.stringify(history));  localStorage.setItem(todayKey, JSON.stringify(draw));}function getSpreadValue() {  return parseInt(document.querySelector('input[name="spread"]:checked').value);}function drawRunes(count) {  const pool = [...RUNES];  const drawn = [];  for (let i = 0; i < count; i++) {    const idx = Math.floor(Math.random() * pool.length);    const rune = { ...pool.splice(idx, 1)[0] };    rune.isReversed = rune.reversed !== null && Math.random() < 0.5;    drawn.push(rune);  }  return drawn;}function performDraw() {  const spreadCount = getSpreadValue();  const todayKey = getTodayKey();  const existing = localStorage.getItem(todayKey);  let draw;  if (existing) {    draw = JSON.parse(existing);    document.getElementById('today-notice').classList.remove('hidden');  } else {    document.getElementById('today-notice').classList.add('hidden');    const runes = drawRunes(spreadCount);    const positions = SPREAD_POSITIONS[spreadCount];    draw = {      dateKey: todayKey,      date: new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' }),      spreadCount,      runes: runes.map((r, i) => ({ ...r, position: positions[i] }))    };    saveToHistory(draw);  }  currentDraw = draw;  renderResults(draw);}function renderResults(draw) {  const area = document.getElementById('results-area');  const positions = draw.runes;  const colClass = positions.length === 1 ? 'grid-cols-1 max-w-md mx-auto' :    positions.length === 3 ? 'grid-cols-1 sm:grid-cols-3' : 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3';  // xss-ok: reviewed-internal-data
  area.innerHTML = `
    <p class="text-center text-purple-400 text-sm mb-6">${draw.date}</p>    <div class="grid ${colClass} gap-4">      ${positions.map((entry, i) => `        <article class="rune-card rounded-xl p-5 text-center rune-appear cursor-pointer hover:border-purple-400/60 transition-all"          style="animation-delay:${i * 0.15}s"          onclick="showRuneDetail(${RUNES.findIndex(r=>r.name===entry.name)}, ${entry.isReversed})"          tabindex="0" role="button"          aria-label="${entry.position}: ${entry.name}${entry.isReversed ? '（逆位置）' : ''}"          onkeydown="if(event.key==='Enter'||event.key===' ')this.click()">          <div class="text-purple-400 text-xs font-medium mb-2 uppercase tracking-widest">${entry.position}</div>          <div class="rune-symbol text-purple-200 mb-2 ${entry.isReversed ? 'reversed' : ''}">            ${entry.symbol}          </div>          <div class="text-purple-200 font-bold text-lg">${entry.name}</div>          <div class="text-purple-400 text-xs mb-3">${entry.phonetic} ・ ${entry.meaning}</div>          ${entry.isReversed ? '<span class="inline-block px-2 py-0.5 bg-red-900/50 text-red-300 text-xs rounded-full mb-2">逆位置</span>' : '<span class="inline-block px-2 py-0.5 bg-purple-900/50 text-purple-300 text-xs rounded-full mb-2">正位置</span>'}          <p class="text-purple-300 text-xs leading-relaxed line-clamp-3">${entry.isReversed && entry.reversed ? entry.reversed : entry.upright}</p>          <p class="text-purple-500 text-xs mt-2">クリックで詳細</p>        </article>      `).join('')}    </div>`; // xss-ok: internal constant}function showRuneDetail(runeIdx, isReversed) {  const r = RUNES[runeIdx];  if (!r) return;  const modal = document.getElementById('rune-modal');  // xss-ok: reviewed-internal-data
  document.getElementById('modal-content').innerHTML = `
    <div class="text-center mb-6">      <div class="rune-symbol text-purple-200 ${isReversed ? 'reversed' : ''}">${r.symbol}</div>      <h2 id="modal-title" class="text-2xl font-bold text-purple-200 mt-2">${r.name}</h2>      <p class="text-purple-400">${r.phonetic} ・ ${r.meaning}</p>      ${isReversed ? '<span class="inline-block px-3 py-1 bg-red-900/50 text-red-300 text-sm rounded-full mt-2">逆位置</span>' : ''}    </div>    <div class="space-y-4 text-sm">      <div class="bg-purple-900/30 rounded-lg p-4">        <h3 class="text-purple-300 font-semibold mb-2">正位置の意味</h3>        <p class="text-purple-200">${r.upright}</p>      </div>      ${r.reversed ? `<div class="bg-red-900/20 rounded-lg p-4">        <h3 class="text-red-300 font-semibold mb-2">逆位置の意味</h3>        <p class="text-purple-200">${r.reversed}</p>      </div>` : '<div class="bg-gray-900/30 rounded-lg p-4 text-purple-500 text-xs">このルーンは逆位置がありません。</div>'}      <div class="bg-indigo-900/30 rounded-lg p-4">        <h3 class="text-indigo-300 font-semibold mb-2">現代的解釈</h3>        <p class="text-purple-200">${r.modern}</p>      </div>    </div>`; // xss-ok: internal constant  modal.classList.remove('hidden');  modal.querySelector('button').focus();}function closeModal(e) {  if (!e || e.target === document.getElementById('rune-modal')) {    document.getElementById('rune-modal').classList.add('hidden');  }}document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });function renderHistory() {  const history = loadHistory();  const list = document.getElementById('history-list');  if (!history.length) {    list.innerHTML = '<p class="text-purple-500 text-center py-8">まだ記録がありません</p>';  // xss-ok: reviewed-internal-data    return;  }  list.innerHTML = history.map(draw => `  // xss-ok: reviewed-internal-data    <div class="rune-card history-item rounded-xl p-4 cursor-pointer transition-all"      onclick="expandHistory('${draw.dateKey}')"      tabindex="0" role="button" aria-expanded="false"      onkeydown="if(event.key==='Enter')this.click()">      <div class="flex items-center justify-between">        <span class="text-purple-300 text-sm font-medium">${draw.date}</span>        <span class="text-purple-500 text-xs">${draw.spreadCount}枚引き</span>      </div>      <div class="flex gap-3 mt-2">        ${draw.runes.map(r => `<span class="text-2xl" title="${r.name}">${r.symbol}</span>`).join('')}      </div>      <div id="history-detail-${draw.dateKey}" class="hidden mt-3 pt-3 border-t border-purple-800/50 space-y-2">        ${draw.runes.map(r => `          <div class="text-xs text-purple-400">            <span class="font-medium text-purple-300">${r.position}:</span>            ${r.name} ${r.isReversed ? '(逆)' : ''} — ${(r.isReversed && r.reversed ? r.reversed : r.upright).substring(0,60)}…          </div>`).join('')}      </div>    </div>`).join(''); // xss-ok: internal constant}function expandHistory(key) {  const el = document.getElementById(`history-detail-${key}`);  el.classList.toggle('hidden');}function renderRunesGrid() {  const grid = document.getElementById('runes-grid');  grid.innerHTML = RUNES.map((r, i) => `  // xss-ok: reviewed-internal-data    <button class="rune-card rounded-xl p-3 text-center hover:border-purple-400/60 transition-all group"      onclick="showRuneDetail(${i}, false)"      aria-label="${r.name}: ${r.meaning}">      <div class="text-4xl text-purple-200 mb-1 group-hover:text-purple-100">${r.symbol}</div>      <div class="text-purple-300 text-xs font-semibold">${r.name}</div>      <div class="text-purple-500 text-xs">${r.phonetic}</div>    </button>`).join(''); // xss-ok: internal constant}function switchTab(tab) {  ['draw','history','runes'].forEach(t => {    document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);    const btn = document.getElementById(`tab-${t}`);    btn.setAttribute('aria-selected', t === tab);    btn.classList.toggle('text-purple-200', t === tab);    btn.classList.toggle('border-purple-400', t === tab);    btn.classList.toggle('text-purple-500', t !== tab);    btn.classList.toggle('border-transparent', t !== tab);  });  if (tab === 'history') renderHistory();  if (tab === 'runes') renderRunesGrid();}// Radio button visual updatedocument.querySelectorAll('input[name="spread"]').forEach(radio => {  radio.addEventListener('change', () => {    document.querySelectorAll('.spread-label').forEach(label => {      const forId = label.dataset.for;      const checked = document.getElementById(forId).checked;      label.classList.toggle('bg-purple-700/50', checked);      label.classList.toggle('text-purple-200', checked);      label.classList.toggle('border-purple-600', checked);      label.classList.toggle('text-purple-500', !checked);      label.classList.toggle('border-purple-800/50', !checked);    });    // Clear results and notice when spread changes    document.getElementById('results-area').innerHTML = '';  // xss-ok: reviewed-internal-data    document.getElementById('today-notice').classList.add('hidden');  });});// Check if today's draw exists on load(function() {  const todayKey = getTodayKey();  if (localStorage.getItem(todayKey)) {    document.getElementById('today-notice').classList.remove('hidden');  }})();</script></body></html>
